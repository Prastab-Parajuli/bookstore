<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Book</title>
</head>

<body>

    <h1>Add Book</h1>

    <form th:action="@{/save}" th:object="${book}" method="post">

        <label>Title:</label>
        <input type="text" th:field="*{title}">
        <br><br>

        <label>Author:</label>
        <input type="text" th:field="*{author}">
        <br><br>

        <label>Publication Year:</label>
        <input type="number" th:field="*{publicationYear}">
        <br><br>

        <label>ISBN:</label>
        <input type="text" th:field="*{isbn}">
        <br><br>

        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{price}">
        <br><br>

        <button type="submit">Add Book</button>

    </form>

    <br>

    <a th:href="@{/booklist}">Back to Book List</a>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Book</title>
</head>

<body>

    <h1>Edit Book</h1>

    <form th:action="@{/update}" th:object="${book}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Title:</label>
        <input type="text" th:field="*{title}">
        <br><br>

        <label>Author:</label>
        <input type="text" th:field="*{author}">
        <br><br>

        <label>Publication Year:</label>
        <input type="number" th:field="*{publicationYear}">
        <br><br>

        <label>ISBN:</label>
        <input type="text" th:field="*{isbn}">
        <br><br>

        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{price}">
        <br><br>

        <label>Category:</label>

        <select name="category">
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${book.category != null and book.category.id == cat.id}">
            </option>
        </select>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a th:href="@{/booklist}">Back to Book List</a>

</body>

</html>

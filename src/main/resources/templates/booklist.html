<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Books</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

    <h1>Books</h1>

    <h3>Hello <span sec:authentication="name"></span>!</h3>

    <form th:action="@{/logout}" method="post">
        <input type="submit" value="Sign Out"/>
    </form>

    <br>

    <table class="table table-striped">

        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Publication Year</th>
            <th>ISBN</th>
            <th>Price</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>

        <tr th:each="book : ${books}">

            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.category.name}"></td>

            <td>
                <a class="btn btn-danger" sec:authorize="hasRole('ADMIN')"
                   th:href="@{/delete/{id}(id=${book.id})}">
                    Delete
                </a>

                <a th:href="@{/edit/{id}(id=${book.id})}">
                    Edit
                </a>
            </td>

        </tr>

    </table>

    <br>

    <a class="btn btn-success" th:href="@{/addbook}">Add Book</a>

</body>

</html>
